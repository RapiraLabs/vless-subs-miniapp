name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate config.js
        run: |
          cat > config.js << EOF
          window.APP_CONFIG = {
            API_URL:  "${{ secrets.VITE_API_URL }}",
            BOT_NAME: "${{ secrets.VITE_BOT_NAME }}"
          };
          EOF

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.CR_TOKEN }}
          publish_dir: .